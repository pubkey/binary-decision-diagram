name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - run: npm install
      - run: npm run build
      - run: npm run test
      - run: npm run test:performance
      - run: npm run lint
